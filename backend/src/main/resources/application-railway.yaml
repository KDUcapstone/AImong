server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SUPABASE_DB_URL:${DB_URL}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:0}
      data-source-properties:
        prepareThreshold: 0
  flyway:
    validate-on-migrate: false

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
