version: "2026-04-15"
schema: "aimong.keris.mission-rules.v1"

sourcePriority:
  - "🧩 AImong 문제 생성 시스템 설계서 v1.4"
  - "review-v2.md"
  - "validation-v2.txt"
  - "question-bank-v2.json"
  - "docs/keris/*"
  - "초등 교사를 위한 KERIS와 시작하는 인공지능 교육 1.pdf (reference only)"

contracts:
  questionLookupKey: "missionId"
  clientQuestionSetSize: 10
  officialQuestionTypes: ["OX", "MULTIPLE", "FILL", "SITUATION"]
  officialContentTags: ["FACT", "PRIVACY", "PROMPT", "SAFETY", "VERIFICATION"]
  getResponseMustHide:
    - "answer"
    - "answer_payload"
    - "explanation"
  submitResponseMayReturn:
    - "explanation"

seedPlan:
  totalMissions: 16
  totalQuestions: 960
  questionsPerMission: 60
  packsPerMission: 6
  questionsPerPack: 10
  typeQuotaPerPack:
    OX: 2
    MULTIPLE: 3
    FILL: 2
    SITUATION: 3
  typeQuotaPerMission:
    OX: 12
    MULTIPLE: 18
    FILL: 12
    SITUATION: 18
  typeQuotaGlobal:
    OX: 192
    MULTIPLE: 288
    FILL: 192
    SITUATION: 288

difficultyPolicy:
  description: "LOW/MEDIUM/HIGH are mission-local quota bands, not cross-stage concept upgrades."
  bandQuotaPerMission:
    LOW: 30
    MEDIUM: 20
    HIGH: 10
  bandQuotaGlobal:
    LOW: 480
    MEDIUM: 320
    HIGH: 160
  bandTemplatePerPack:
    - packNo: 1
      LOW: 5
      MEDIUM: 3
      HIGH: 2
    - packNo: 2
      LOW: 5
      MEDIUM: 3
      HIGH: 2
    - packNo: 3
      LOW: 5
      MEDIUM: 3
      HIGH: 2
    - packNo: 4
      LOW: 5
      MEDIUM: 3
      HIGH: 2
    - packNo: 5
      LOW: 5
      MEDIUM: 4
      HIGH: 1
    - packNo: 6
      LOW: 5
      MEDIUM: 4
      HIGH: 1
  numericDifficultyMapping:
    stage1:
      LOW: 1
      MEDIUM: 2
      HIGH: 2
    stage2:
      LOW: 2
      MEDIUM: 3
      HIGH: 3
    stage3:
      LOW: 3
      MEDIUM: 4
      HIGH: 4

servingPolicy:
  preferIntactPackFirst: true
  normalModeExcludeSolvedFirst: true
  reviewModeAllowsReuse: true
  targetPoolPerMission: 60
  softRefillTrigger: 36
  hardRefillTrigger: 18
  syncGenerateBatch: 10

globalRules:
  targetGrades: [5, 6]
  explanationMaxSentences: 2
  allowedRealWorldContexts:
    - "학교"
    - "숙제"
    - "발표"
    - "번역 앱"
    - "카메라 앱"
    - "검색"
    - "그림 분류"
    - "사진 수집"
    - "목소리"
    - "친구와의 대화"
  bannedDirectQuestionThemes:
    - "국가 AI 정책 자체를 묻는 문제"
    - "산업 동향 암기형 문제"
    - "법 원문 암기형 문제"
    - "성인 정책 보고서 요약 문제"
  bannedSensitiveInputs:
    - "실제 이름"
    - "실제 주소"
    - "실제 전화번호"
    - "실제 얼굴 사진"
    - "실제 지문"
    - "실제 목소리 식별 정보"

stages:
  - stage: 1
    title: "AI가 뭐예요?"
    learningGoal: "AI의 원리와 한계 이해"
    missionCount: 5
    baseQuestionCount: 50
    expandedQuestionCount: 300
    difficultyRange: [1, 2]
    stageGuardrails:
      allowed:
        - "생활 속 AI 사례"
        - "AI와 계산기의 차이"
        - "데이터·레이블·학습·테스트"
        - "딥러닝과 인식의 기초"
        - "AI의 한계와 다시 확인하기"
      banned:
        - "출처 비교 심화"
        - "사회구조 수준 편향 분석"
        - "Moral Machine 심화 토론"
        - "법/정책 원문 이해"

  - stage: 2
    title: "AI 잘 쓰기"
    learningGoal: "프롬프트 작성과 개인정보 보호"
    missionCount: 6
    baseQuestionCount: 60
    expandedQuestionCount: 360
    difficultyRange: [2, 3]
    stageGuardrails:
      allowed:
        - "좋은 질문과 목적·조건 추가"
        - "개인정보·생체정보 보호"
        - "데이터 다양성·허락·저작권"
        - "테스트·수정·재질문"
        - "AI 도움을 받고 내 답으로 정리하기"
      banned:
        - "정책 해석"
        - "산업 동향 문제"
        - "추상 윤리 논쟁 중심 문제"
        - "고난도 편향 이론"

  - stage: 3
    title: "비판적 사고"
    learningGoal: "팩트체크와 출처 확인, 편향과 양면성 판단"
    missionCount: 5
    baseQuestionCount: 50
    expandedQuestionCount: 300
    difficultyRange: [3, 4]
    stageGuardrails:
      allowed:
        - "팩트체크"
        - "출처·날짜·기관·근거 비교"
        - "대표성 부족과 데이터 편향"
        - "기술의 긍정·부정 영향 함께 보기"
        - "공정성·딜레마"
      banned:
        - "대학 수준 윤리학 용어 남발"
        - "법/정책 원문 암기형"
        - "전문 철학 토론"

missions:
  - missionCode: "S0101"
    stage: 1
    stageTitle: "AI가 뭐예요?"
    missionTitle: "AI는 어디에 있을까?"
    baseDifficulty: 1
    targetGrades: [5, 6]
    questionPoolTarget: 60
    packCount: 6
    allowedConcepts:
      - "생활 속 AI 사례"
      - "번역 앱, 카메라 앱, 스마트 스피커"
      - "기능 중심으로 AI 찾기"
      - "Quick Draw 같은 인식 체험"
    bannedConcepts:
      - "심화 윤리 논쟁"
      - "출처 비교 심화"
      - "정책 설명"
    preferredQuestionTypes: ["OX", "MULTIPLE", "FILL", "SITUATION"]
    preferredContentTags: ["FACT", "VERIFICATION", "SAFETY"]
    difficultyRange: [1, 2]
    numericDifficultyMapping:
      LOW: 1
      MEDIUM: 2
      HIGH: 2
    curriculumRef: "KERIS-1 Ch2.1 pp.27-29; Ch3.1 pp.83-96; D0qG389 STEP 1"
    kerisRefs:
      - "Chapter 2.1 생활 속 인공지능"
      - "Chapter 3.1 우리 생활 속 인공지능"
    goodScenarioPatterns:
      - "생활 도구들 중 AI 기능이 있는 것 찾기"
      - "겉모습보다 기능으로 판단하기"
      - "Quick Draw 결과를 보고 추정 방식 이해하기"
    avoidScenarioPatterns:
      - "정치, 산업, 법률"
      - "추상 철학 질문"

