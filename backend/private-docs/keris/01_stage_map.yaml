stages:
  - stage: 1
    code: "STEP_01"
    title: "AI가 뭐예요?"
    learningGoal: "AI의 원리와 한계 이해"
    educationalRole: "concept understanding"
    targetGrades: [5, 6]
    missionCount: 5
    baseQuestionCount: 50
    expandedQuestionCount: 300
    questionsPerMissionBase: 10
    questionsPerMissionExpanded: 60
    packsPerMission: 6
    difficultyRange: [1, 2]
