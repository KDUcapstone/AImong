        - "고난도 편향 이론"
        - "성인 보안 정책 암기"
    missions:
      - missionCode: "S0201"
        missionTitle: "좋은 질문은 목적이 보여요"
        baseDifficulty: 2
        missionSummary: "무엇을 하려는지 먼저 말하는 질문을 연습합니다."
        curriculumRef: "KERIS-1 Ch3.1 pp.83-96; Ch3.5 pp.135-154; D0qG389 STEP 2; AImong v1.4 TYPE 2/4 prompt examples"
      - missionCode: "S0202"
        missionTitle: "좋은 질문은 조건이 구체적이에요"
        baseDifficulty: 2
        missionSummary: "대상, 길이, 형식 같은 조건을 넣어 더 좋은 답을 받는 법을 익힙니다."
        curriculumRef: "KERIS-1 Ch3.1 pp.83-96; Ch3.4-3.5 pp.119-154; D0qG389 STEP 2; AImong v1.4"
      - missionCode: "S0203"
        missionTitle: "개인정보와 생체정보를 지켜요"
        baseDifficulty: 2
        missionSummary: "주소, 전화번호, 얼굴, 지문, 목소리 같은 민감한 정보를 안전하게 다룹니다."
        curriculumRef: "KERIS-1 Ch2.1 pp.27-29; Ch4.2 pp.163-178; D0qG389 STEP 2"
      - missionCode: "S0204"
        missionTitle: "사진·음성·데이터를 바르게 모아요"
        baseDifficulty: 3
        missionSummary: "AI 학습용 자료를 모을 때 다양성, 저작권, 허락을 함께 살핍니다."
        curriculumRef: "KERIS-1 Ch3.4 pp.119-134; Ch3.5 pp.135-154; Ch4.2 pp.167-178"
      - missionCode: "S0205"
        missionTitle: "AI 도구를 실험하고 고쳐요"
        baseDifficulty: 3
        missionSummary: "AI for Oceans와 Teachable Machine처럼 결과를 보고 수정하는 활동을 연습합니다."
        curriculumRef: "KERIS-1 Ch3.4 pp.119-134; Ch3.5 pp.135-154"
      - missionCode: "S0206"
        missionTitle: "AI 도움을 받고 내 답으로 정리해요"
        baseDifficulty: 3
        missionSummary: "AI는 힌트와 예시를 주는 도구로 활용하고, 마지막 정리는 내 말로 합니다."
        curriculumRef: "KERIS-1 Ch3.1 pp.83-96; Ch3.5 pp.135-154; D0qG389 STEP 2"

