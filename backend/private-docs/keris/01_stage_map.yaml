      banned:
        - "출처 비교 심화"
        - "사회구조 수준 편향 분석"
        - "Moral Machine 심화 토론"
        - "법/정책 원문 이해"
        - "대학 수준 윤리학 용어"
    missions:
      - missionCode: "S0101"
        missionTitle: "AI는 어디에 있을까?"
        baseDifficulty: 1
        missionSummary: "생활 속 여러 도구에서 AI가 하는 일을 알아봅니다."
        curriculumRef: "KERIS-1 Ch2.1 pp.27-29; Ch3.1 pp.83-96; D0qG389 STEP 1"
      - missionCode: "S0102"
        missionTitle: "AI와 계산기는 어떻게 다를까?"
        baseDifficulty: 1
        missionSummary: "규칙 기반과 학습 기반의 차이를 통해 AI와 계산기를 구별합니다."
        curriculumRef: "KERIS-1 Ch2.2 pp.39-50; Ch3.2 pp.97-103; D0qG389 STEP 1"
      - missionCode: "S0103"
        missionTitle: "AI는 데이터를 보고 배워요"
        baseDifficulty: 2
        missionSummary: "레이블, 학습, 테스트를 통해 기계학습의 기본을 이해합니다."
        curriculumRef: "KERIS-1 Ch2.1 pp.34-38; Ch3.2 pp.97-103; Ch3.4 pp.119-134"
      - missionCode: "S0104"
        missionTitle: "딥러닝과 인식"
        baseDifficulty: 2
        missionSummary: "딥러닝이 이미지, 음성, 번역 같은 인식 문제에 어떻게 쓰이는지 알아봅니다."
        curriculumRef: "KERIS-1 Ch2.1 pp.27-29; Ch2.3 pp.61-80; Ch2.1 pp.28-29"
      - missionCode: "S0105"
        missionTitle: "AI도 틀릴 수 있어요"
        baseDifficulty: 2
        missionSummary: "AI의 한계와 그럴듯하지만 틀릴 수 있는 답을 다시 확인하는 연습을 합니다."
        curriculumRef: "KERIS-1 Ch2.2 pp.41-43; Ch4.2 p.167; D0qG389 STEP 1"

  - stage: 2
