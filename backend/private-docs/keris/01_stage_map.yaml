        baseDifficulty: 3
        missionSummary: "글쓴이, 날짜, 기관, 근거를 보며 여러 자료를 비교합니다."
        curriculumRef: "KERIS-1 Ch4.1-4.2 pp.157-178; D0qG389 STEP 3"
      - missionCode: "S0303"
        missionTitle: "편향을 찾아봐요"
        baseDifficulty: 4
        missionSummary: "대표성이 부족한 데이터가 어떤 치우친 결과를 만드는지 살펴봅니다."
        curriculumRef: "KERIS-1 Ch4.2 pp.163-178; Ch4.4 pp.192-224"
      - missionCode: "S0304"
        missionTitle: "AI의 양면성을 생각해요"
        baseDifficulty: 4
        missionSummary: "같은 기술도 긍정적 영향과 부정적 영향을 함께 볼 수 있음을 이해합니다."
        curriculumRef: "KERIS-1 Ch4.1 pp.157-162"
      - missionCode: "S0305"
        missionTitle: "딜레마와 공정한 선택"
        baseDifficulty: 4
        missionSummary: "Moral Machine 사례처럼 이해관계자를 생각하며 공정한 선택을 고민합니다."
        curriculumRef: "KERIS-1 Ch4.3 pp.179-191"
