    title: "AI 잘 쓰기"
    learningGoal: "프롬프트 작성과 개인정보 보호"
    educationalRole: "proper use"
    targetGrades: [5, 6]
    missionCount: 6
    baseQuestionCount: 60
    expandedQuestionCount: 360
    questionsPerMissionBase: 10
    questionsPerMissionExpanded: 60
    packsPerMission: 6
    difficultyRange: [2, 3]
    numericDifficultyMapping:
      LOW: 2
      MEDIUM: 3
      HIGH: 3
    stageFocus:
      - "좋은 질문과 목적 드러내기"
      - "조건을 구체적으로 추가하기"
      - "개인정보·생체정보 보호"
      - "사진·음성·데이터 수집의 기본 원칙"
      - "AI 도구 테스트·수정·재시도"
      - "AI 도움을 받고 내 답으로 정리하기"
    stageGuardrails:
      allowed:
        - "생활 장면 중심 문제"
        - "프롬프트 수정과 재질문"
